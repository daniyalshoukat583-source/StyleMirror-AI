<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleMirror AI</title>
    <style>
        body {
            width: 320px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #171717;
            color: white;
        }

        h2 {
            text-align: center;
            color: #d8a7ff;
        }

        p {
            text-align: center;
            color: #cccccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #a855f7;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #9333ea;
        }
    </style>
</head>
<body>
    <h2>StyleMirror AI</h2>
    <p>Your Personal AI Fashion Stylist</p>

    <button id="tryOn">Virtual Try-On</button>
    <button id="designer">Fashion Designer</button>
    <button id="stylist">AI Personal Stylist</button>

    <script src="popup.js"></script>
</body>
</html>
